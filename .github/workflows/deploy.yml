name: Deploy Morocco Vibe

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e

            echo "=============================="
            echo "🚀 Morocco Vibe Deployment"
            echo "=============================="

            cd ~/morocco-vibe

            echo "📥 Pull latest code..."
            git pull origin main

            ################################
            # Backend
            ################################
            echo "📦 Backend"

            cd backend

            npm ci
            npm run build

            pm2 restart backend

            ################################
            # Frontend
            ################################
            echo "📦 Frontend"

            cd ../frontend

            npm ci
            npm run build

            pm2 restart frontend

            ################################
            # Save PM2
            ################################

            pm2 save

            echo "=============================="
            echo "✅ Deployment Success"
            echo "=============================="